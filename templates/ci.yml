name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build
      # Lockstep only: every browser engine must compute the same game.
      # - run: npx playwright install --with-deps chromium firefox webkit
      # - run: npx lobbyhop determinism src/multiplayer/determinism.ts --require-all
