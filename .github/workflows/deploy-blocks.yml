name: Deploy blocks

# Deploys examples/blocks (the persistent block world) to Cloudflare Workers.
# Runs on pushes to main that touch the example or the library, or by hand
# (Actions → Deploy blocks → Run workflow).
#
# One-time setup (repo → Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   a token from the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  from the Cloudflare dashboard (Workers & Pages → Account ID)
# Without them the job skips with a notice instead of failing.

on:
  push:
    branches: [main]
    paths: ['examples/blocks/**', 'src/**', 'package-lock.json', '.github/workflows/deploy-blocks.yml']
  workflow_dispatch:

concurrency:
  group: deploy-blocks
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for Cloudflare credentials
        id: creds
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Skipping deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable it."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v6
        if: steps.creds.outputs.ok == 'true'
      - uses: actions/setup-node@v6
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.creds.outputs.ok == 'true'
        run: npm ci
      # Don't ship a broken world: the example's own tests gate the deploy.
      - if: steps.creds.outputs.ok == 'true'
        run: npx vitest run tests/blocks.test.ts tests/world.test.ts
      - if: steps.creds.outputs.ok == 'true'
        run: node tools/build-example.mjs blocks
      - if: steps.creds.outputs.ok == 'true'
        run: npx wrangler deploy -c examples/blocks/wrangler.jsonc
