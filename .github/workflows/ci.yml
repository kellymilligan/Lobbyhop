name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      # Lockstep needs every engine to compute the same game: replay scripted
      # arena games in Node, Chromium, Firefox and WebKit and compare hashes.
      - run: node tools/determinism.mjs examples/arena/determinism.ts --minutes 10 --require-all
      # Real browsers, real rooms: wrangler (Durable Objects) and the Node adapter.
      - run: node tools/e2e.mjs --example arena -n 2 --script examples/arena/e2e-actions.mjs --out out/e2e-wrangler
      - run: node tools/e2e.mjs --example arena -n 3 --node --script examples/arena/e2e-actions.mjs --out out/e2e-node
      - run: node tools/e2e.mjs --example tictactoe -n 3 --node --seconds 4 --out out/e2e-ttt
      # The persistent physics world (Box3D in the Durable Object, three.js on the WebGL 2 fallback).
      - run: node tools/e2e.mjs --example blocks -n 2 --seconds 5 --viewport 900x560 --out out/e2e-blocks
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: e2e-screenshots
          path: out/
