<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Counter race · lobbyhop</title>
    <style>
      html, body { margin: 0; height: 100%; background: radial-gradient(circle at 30% 20%, #2b3350, #0d0f17 70%); color: #f3f4f8; font-family: ui-sans-serif, system-ui, sans-serif; }
      main { max-width: 560px; margin: 0 auto; padding: 72px 16px; display: flex; flex-direction: column; gap: 24px; }
      h1 { margin: 0; font-weight: 600; letter-spacing: -0.02em; }
      #click { font: inherit; font-size: 22px; padding: 18px; border-radius: 16px; border: 0; background: #7c9cff; color: #0b0d14; font-weight: 700; cursor: pointer; }
      #click:active { transform: scale(0.98); }
      #click:disabled { opacity: 0.4; }
      .bar { display: grid; grid-template-columns: 110px 1fr 40px; gap: 10px; align-items: center; margin: 8px 0; }
      .bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .bar i { display: block; height: 14px; border-radius: 7px; transition: width 80ms; }
      .bar b { text-align: right; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body>
    <main>
      <h1>Counter race</h1>
      <button id="click">Click!</button>
      <div id="bars"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
